name: 本文Web版とPDFをビルドしてPagesへ公開

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    name: Python・Go演習の期待出力を検証
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6

      - name: Pythonを導入
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: tools/requirements-examples.txt

      - name: Goを導入
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: 演習の依存ライブラリを導入
        run: python -m pip install -r tools/requirements-examples.txt

      - name: 検証ツールの異常検出を確認
        run: python -m unittest discover -s tools -p 'test_check_examples.py' -v

      - name: 本文の演習を実行して付録と照合
        run: make verify-examples PYTHON=python

  build:
    name: LuaLaTeXでビルド
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6

      - name: TeXと検証ツールを導入
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            texlive-luatex \
            texlive-lang-japanese \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-noto-cjk \
            poppler-utils \
            pandoc

      - name: Node.jsを導入
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Web版の依存ライブラリを導入
        run: npm ci --prefix site

      - name: PDFと公開ページを生成
        run: make site

      - name: 組版結果を検証
        run: make verify

      - name: Web本文・計算・リンク・検索を検証
        working-directory: site
        run: |
          npm test
          npm run test:site

      - name: PR確認用Web版を保存
        uses: actions/upload-artifact@v4
        with:
          name: interactive-textbook-${{ github.sha }}
          path: site/dist
          if-no-files-found: error

      - name: PR確認用PDFを保存
        uses: actions/upload-artifact@v4
        with:
          name: information-engineering-basics-${{ github.sha }}
          path: build/information-engineering-basics.pdf
          if-no-files-found: error

      - name: Pagesを設定
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Pages成果物を保存
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: GitHub Pagesへ公開
    if: github.event_name != 'pull_request'
    needs: [build, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
